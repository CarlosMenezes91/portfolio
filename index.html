<style id="ds">
/* CM Design System · base comum (fonte: Figma, coleções CM / Primitives e CM / Portfolio) */
:root{color-scheme:dark;
--night:#101216;--paper:#f4f1db;--ink:#090909;--white:#faf9f4;--pink:#ff4eae;--lime:#dcff00;--blue:#8ca6ff;
--bg:var(--night);--fg:var(--paper);--raised:#1c2027;--muted:#b9bdc6;--line:#8c8c8c;--btn-edge:#858585;
--focus:#a9bcff;--accent-text:#ff7bc2;--hl:var(--lime);--ms:160ms;
--max:1136px;--gutter:max(5vw,16px)}
:root[data-theme=light]{color-scheme:light;
--bg:var(--paper);--fg:var(--night);--raised:var(--white);--muted:#494e59;--line:#666b74;--btn-edge:var(--ink);
--focus:#284bc2;--accent-text:#990a52;--hl:var(--pink)}
/* Botão: cápsula com volume; foco indicado pelo volume na cor de foco */
.btn{--v:6px;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:999px;border:3px solid var(--btn-edge);background:var(--raised);color:var(--fg);font:600 16px/1.4 Archivo,sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 var(--v) 0 var(--btn-edge);transform:translateY(calc(6px - var(--v)));transition:box-shadow var(--ms),transform var(--ms)}
.btn.primary{background:var(--lime);color:var(--ink)}
.btn:hover{--v:4px}.btn:active{--v:0px}
.btn:focus-visible{outline:none;box-shadow:0 var(--v) 0 var(--focus);border-color:var(--focus)}
.btn svg{width:18px;height:18px}
/* Troca de tema: presente no topo de todas as páginas */
.theme{width:44px;height:44px;flex:none;padding:0;border-radius:999px;border:3px solid var(--btn-edge);background:var(--raised);color:var(--fg);cursor:pointer;display:inline-grid;place-items:center}
.theme svg{width:20px;height:20px}
.theme:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}

/* Topo padrão: assinatura leva à home; menu do site; troca de tema */
.cm-top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid color-mix(in srgb,var(--line) 40%,transparent)}
.cm-top__in{max-width:var(--max);margin:0 auto;padding:0 var(--gutter);box-sizing:content-box;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.cm-sig{font:700 20px/1 Archivo,sans-serif;color:var(--fg);text-decoration:none;flex:none}
.cm-sig b{color:var(--pink)}
.cm-menu{display:flex;align-items:center;gap:clamp(12px,2.4vw,24px);font:600 16px/1 Archivo,sans-serif}
.cm-menu a{display:inline-flex;align-items:center;min-height:44px;color:var(--fg);text-decoration:none}
.cm-menu a:hover,.cm-menu a[aria-current=page]{color:var(--accent-text)}
@media(max-width:600px){.cm-sig{font-size:17px}.cm-menu{gap:14px;font-size:15px}.cm-top__in{min-height:64px}}
@media(max-width:360px){.cm-menu{gap:10px;font-size:14px}}
/* Índice de capítulos dos cases */
.cm-index{max-width:var(--max);margin:0 auto clamp(56px,7vw,96px);padding:0 var(--gutter);box-sizing:content-box}
.cm-index ol{list-style:none;margin:0;padding:24px 32px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px 24px;background:var(--raised);border-radius:8px}
.cm-index a{display:grid;gap:4px;color:var(--fg);text-decoration:none;font:700 14px/1.4 Archivo,sans-serif}
.cm-index a span{color:var(--accent-text)}
.cm-index a:hover{color:var(--accent-text)}
@media(max-width:860px){.cm-index ol{grid-template-columns:repeat(2,minmax(0,1fr));padding:20px}}
/* Contato padrão: sempre escuro */
.cm-contact{--bg:#101216;--fg:#f4f1db;--raised:#1c2027;--muted:#b9bdc6;--line:#8c8c8c;--btn-edge:#858585;--focus:#a9bcff;--hl:#dcff00;--accent-text:#ff7bc2;color-scheme:dark;background:var(--bg);color:var(--fg);padding-top:clamp(64px,8vw,112px)}
.cm-contact__in{max-width:var(--max);margin:0 auto;padding:0 var(--gutter);box-sizing:content-box}
.cm-label{display:block;font:700 14px/1.4 Archivo,sans-serif;color:var(--accent-text)}
.cm-display{font:400 clamp(52px,8vw,88px)/1.05 Anton,Impact,sans-serif;margin:12px 0 0;max-width:none;text-wrap:balance;color:var(--fg)}
.cm-mark{position:relative;display:inline-block;padding:0 .12em;color:var(--ink);z-index:0}
.cm-mark::before{content:"";position:absolute;inset:.08em 0 .02em;background:var(--hl);z-index:-1;transform-origin:left;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.8,.2,1) .2s}
.is-in .cm-mark::before{transform:scaleX(1)}
.cm-acts{display:flex;flex-wrap:wrap;gap:16px;margin:32px 0 24px}
.cm-info{margin:0;max-width:none;color:var(--muted);font:400 16px/1.6 Archivo,sans-serif}
.cm-copied{margin:8px 0 0;min-height:1.6em;max-width:none;color:var(--hl);font:600 14px/1.6 Archivo,sans-serif}
.cm-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-top:32px;padding:8px 0 16px;border-top:1px solid var(--line);color:var(--muted);font:400 13px/1.4 Archivo,sans-serif}
.cm-foot a{display:inline-flex;align-items:center;min-height:44px;color:var(--fg);font-weight:600;text-decoration:underline;text-underline-offset:4px}
@media(prefers-reduced-motion:reduce){.cm-mark::before{transform:scaleX(1);transition:none}}

.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em}
.btn .ic{width:20px;height:20px}
</style>
<style data-page="home" media="not all">
/* VOICE: confiante, direto, com humor de ofício
   IDEA: um caderno de obra do designer: grifo, asterisco, trilho e adesivos
   PICTURE: colagem do Sobre mim; faixas inclinadas de marcas e disciplinas
   COLOUR and TYPE: tokens CM (carvão/creme, lima, rosa, azul); Anton + Archivo
   LAYOUT: nav, hero, sobre mim, faixa de marcas, cases, faixa de disciplinas, contato */
:root{--display:Anton,Impact,"Archivo Narrow",sans-serif}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 Archivo,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding-inline:var(--gutter);box-sizing:content-box}
.skip{position:absolute;left:16px;top:-80px;padding:12px 16px;background:var(--fg);color:var(--bg);font-weight:700;border-radius:8px;z-index:20}
.skip:focus{top:16px}
.meta{margin:0;font-size:14px;font-weight:600;color:var(--muted)}
.disp{font-family:var(--display);font-weight:400;line-height:1.08;margin:0}


.btns{display:flex;flex-wrap:wrap;gap:16px}
.link{font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.2em;text-decoration-color:var(--accent-text)}
.link:hover{color:var(--accent-text)}

/* hero */
.hero{padding-block:clamp(40px,7vw,88px) clamp(56px,8vw,104px);display:flex;flex-direction:column;gap:40px}
.hero h1{font-size:clamp(3rem,1rem + 7vw,7rem);display:flex;flex-direction:column;align-items:flex-start}
.k{background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 0/0% 100%;padding:0 .1em;animation:grifo 8s infinite}
.k2{animation-delay:4s}
@keyframes grifo{0%{background-size:0% 100%;color:var(--fg)}8%,42%{background-size:100% 100%;color:var(--ink)}50%,100%{background-size:0% 100%;color:var(--fg)}}
.hero-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px}

/* sobre mim */
#sobre{border-top:1px solid var(--line)}
.about{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(32px,6vw,80px);align-items:center;padding-block:clamp(64px,9vw,120px)}
.about h2{font-size:clamp(3rem,1rem + 5.5vw,5.5rem);margin:12px 0 28px}
.about h2 span{color:var(--pink)}
.statement{font-size:clamp(1.125rem,.95rem + .7vw,1.5rem);line-height:1.38;letter-spacing:-.01em;margin:0 0 28px}
.statement em{font-style:italic}
.statement b{font-weight:700}
.collage{position:relative;width:100%;max-width:440px;justify-self:center;aspect-ratio:440/560;container-type:inline-size}
.collage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ast{position:absolute;left:44%;top:-22%;font-family:var(--display);font-size:127cqw;line-height:1;color:var(--pink);pointer-events:none;user-select:none}
.stk{position:absolute;display:flex;flex-direction:column;gap:2px;padding:12px 18px 14px;border:3px solid var(--ink);border-radius:8px;box-shadow:0 6px 0 var(--ink);color:var(--ink);max-width:62%;transition:transform .2s}
.stk small{font-size:max(12px,3.2cqw);font-weight:700}
.stk b{font-size:max(15px,5cqw);line-height:1.2}
.s1{left:21%;top:6%;background:var(--pink);rotate:-4deg}
.s2{left:48%;top:48%;background:var(--lime);rotate:3deg}
.s3{left:48%;top:77%;background:var(--blue);rotate:-2deg}
.stk:hover{transform:translateY(-4px) rotate(1deg)}
@media(max-width:820px){.about{grid-template-columns:minmax(0,1fr)}.collage{max-width:400px;justify-self:start}}

/* faixas */
.band{overflow:hidden;padding-block:28px}
.track{display:flex;width:max-content;animation:mq 40s linear infinite}
.band:hover .track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.brands{background:var(--pink);color:var(--ink);border-block:3px solid var(--ink);rotate:1.5deg;margin-inline:-20px}
.brands .track{align-items:center;gap:64px;padding:4px 32px}
.brands svg{height:clamp(30px,3vw,42px);width:auto;display:block;fill:currentColor}
.disc{background:var(--lime);color:var(--ink);border-block:3px solid var(--ink);rotate:-1.5deg;margin-inline:-20px}
.disc .track{padding:18px 0;font-family:var(--display);font-size:clamp(1.75rem,1rem + 2.5vw,3rem);line-height:1;white-space:nowrap}
.disc span{padding-right:32px}.disc b{color:#990A52;font-weight:400}

/* cases */
#cases{padding-block:clamp(72px,9vw,120px)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;margin-bottom:24px}
.sec-head h2{font-size:clamp(2rem,1.2rem + 3.5vw,3rem)}
.case{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,4vw,48px);align-items:center;padding-block:40px;border-top:1px solid var(--line)}
.case:last-child{border-bottom:1px solid var(--line)}
.cover{position:relative;aspect-ratio:16/10;border-radius:8px;border:3px solid var(--btn-edge);overflow:hidden;display:flex;align-items:flex-end;padding:20px;transition:transform .2s,box-shadow .2s;container-type:inline-size}
.case:hover .cover{transform:translateY(-4px);box-shadow:0 4px 0 var(--btn-edge)}
.cover b{font-family:var(--display);font-weight:400;font-size:22cqw;line-height:.85;letter-spacing:-.01em}
.cover i{position:absolute;right:4%;top:-6%;font-family:var(--display);font-style:normal;font-size:60cqw;line-height:1;opacity:.9}
.c-veloe{background:var(--blue);color:var(--ink)}.c-veloe i{color:var(--pink)}
.c-b3{background:var(--lime);color:var(--ink)}.c-b3 i{color:var(--pink)}
.c-digio{background:var(--pink);color:var(--ink)}.c-digio i{color:var(--ink)}
.info{display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;gap:12px}
.yr{color:var(--accent-text)}
.info h3{font-size:clamp(1.75rem,1rem + 2vw,3rem)}
.info h3 a{text-decoration:none}
.info h3 a::after{content:"";position:absolute;inset:0}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.tags li{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border:1px solid var(--muted);border-radius:999px;font-size:14px;font-weight:700}
.tags .brand{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.info p{margin:0}
.sum{color:var(--muted);font-size:clamp(1rem,.95rem + .2vw,1.125rem)}
.role{font-size:14px;font-weight:600}
.go{font-weight:700;font-size:15px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.2em;text-decoration-color:var(--accent-text)}
.soon{color:var(--muted);font-size:14px;font-weight:600}
@media(max-width:760px){.case{grid-template-columns:minmax(0,1fr)}}


@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.k,.track{animation:none}.k2{background-size:100% 100%;color:var(--ink)}.cover,.stk{transition:none}}


.band.brands{padding-block:8px}

.brands .bl{display:block;flex:none;height:clamp(30px,3vw,42px);aspect-ratio:var(--ar);background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.bl-digio{--m:url(assets/img/2e2d3752db70.png);--ar:1.7292}
.bl-uber-conta{--m:url(assets/img/91052507b531.png);--ar:3.4306}
.bl-veloe{--m:url(assets/img/70dd5543ba19.png);--ar:2.0243}
.bl-b3r{--m:url(assets/img/4b02a49bc38f.png);--ar:0.9757}
.bl-centauro{--m:url(assets/img/ee8f3f560b2f.png);--ar:3.4583}
.bl-nike{--m:url(assets/img/c3c8cb93d652.png);--ar:1.5174}
.bl-enforce{--m:url(assets/img/7a7ce10956d5.png);--ar:3.0347}

/* cases: ordem cronológica e capas com tela */
.sec-head{align-items:end}
.sec-head .side{display:grid;gap:12px;justify-items:end}
.sort{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--raised)}
.sort button{min-height:40px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--fg);font:600 14px/1 Archivo,sans-serif;cursor:pointer}
.sort button[aria-pressed=true]{background:var(--lime);color:var(--ink)}
.sort button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.cases{display:grid}
.cover{display:block;padding:0}
.cover b{position:absolute;left:20px;bottom:16px;z-index:2;font-size:17cqw}
.cover i{position:absolute;left:20px;right:auto;top:10px;z-index:2;font-size:24cqw;line-height:.8}
.cover .shot{position:absolute;right:7%;top:11%;width:33%;border-radius:14px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 8px 0 var(--ink);transform:rotate(6deg);transition:transform .35s cubic-bezier(.3,1.4,.5,1);z-index:1;background:#fff}
.cover .shot img{display:block;width:100%}
.case:hover .cover .shot{transform:rotate(2deg) translateY(-10px)}
.tags li{font-weight:600}
.c-b3 b{font-size:14.5cqw}
main{overflow-x:clip}
.out{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;font-size:15px;font-weight:600}
.out span{font:700 12px/1 Archivo,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-text)}
.meta.role{color:var(--muted)}
@media(max-width:760px){.sec-head .side{justify-items:start}}
@media(prefers-reduced-motion:reduce){.cover .shot{transition:none}}

/* alvos de toque no topo */
.cm-sig{min-height:44px;display:inline-flex;align-items:center}
.cm-menu a{min-height:44px;display:inline-flex;align-items:center;padding-inline:4px}

.sort button{min-height:44px}
.s4{left:26%;top:30.5%;white-space:nowrap;max-width:none;width:max-content;background:var(--paper,#f4f1e6);rotate:2deg}

<style data-page="curriculo" media="not all">
/* VOICE: confiante e direto — um currículo que se lê como um mapa de transporte.
   IDEA: a carreira como linha de metrô; cada empregador é uma estação, cada marca uma placa encapsulada.
   PICTURE: retrato em placa inclinada + trilho de experiência que se preenche com o scroll.
   COLOUR and TYPE: tokens do CM Portfolio (bg, fg, lime, pink, blue); Anton para cartaz, Archivo para leitura.
   LAYOUT: mapa sticky, hero, faixas por seção, contato sempre escuro. */
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 Archivo,system-ui,sans-serif;overflow-x:clip;transition:background .3s,color .3s}
a{color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding-inline:var(--gutter);box-sizing:content-box}
.display{font:400 clamp(52px,8vw,96px)/1.05 Anton,Impact,sans-serif;margin:0;text-wrap:balance}
.h2{font:400 clamp(32px,4.4vw,48px)/1.12 Anton,Impact,sans-serif;margin:0;text-wrap:balance}
.title{font:700 22px/1.36 Archivo,sans-serif;margin:0}
.meta{font:600 14px/1.6 Archivo,sans-serif;color:var(--muted)}
.label{font:700 14px/1.4 Archivo,sans-serif;color:var(--accent-text)}
.mark{position:relative;display:inline-block;padding:0 .12em;color:var(--ink);z-index:0}
.mark::before{content:"";position:absolute;inset:.08em 0 .02em;background:var(--hl);z-index:-1;transform-origin:left;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.8,.2,1) .25s}
.ready .mark::before{transform:scaleX(1)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}


.tlink{display:inline-flex;align-items:center;gap:6px;min-height:44px;font:600 16px Archivo,sans-serif;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px;background:none;border:0;color:inherit;cursor:pointer;padding:0}
.tlink:hover{color:var(--accent-text)}
.tlink svg{width:16px;height:16px;transition:transform var(--ms)}.tlink:hover svg{transform:translate(2px,-2px)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(32px,6vw,96px);align-items:center;padding-top:clamp(40px,6vw,88px);padding-bottom:clamp(24px,3vw,40px)}
.headline{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px;padding:0;list-style:none}
.headline li{font:600 13px/1 Archivo,sans-serif;padding:8px 12px;border-radius:999px;background:var(--raised);color:var(--fg)}
.hero .intro{font:400 clamp(19px,2vw,22px)/1.65 Archivo,sans-serif;max-width:36ch;margin:28px 0 32px}

.hero .wrap{display:grid;gap:32px}
.ficha{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;border-top:1px solid var(--line);padding-top:20px}
.ficha dt{font-size:13px;color:var(--muted);margin-bottom:6px}.ficha dd{margin:0;font:700 15px/1.4 Archivo,sans-serif}
.stagebox{background:var(--pink);border-radius:8px;height:clamp(340px,42vw,560px);overflow:hidden;display:flex;justify-content:center;gap:clamp(16px,4vw,48px);padding-top:clamp(32px,5vw,64px)}
.stagebox img{width:clamp(130px,22vw,300px);height:auto;border-radius:16px;box-shadow:0 24px 48px rgba(9,9,9,.35);align-self:flex-start}
/* 01 */
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:stretch}
.shot{display:flex;flex-direction:column;gap:16px;transition:opacity .3s,outline-color .3s;outline:2px solid transparent;outline-offset:-2px}
.shot .frame{position:relative;border-radius:8px;overflow:hidden}
.shot .tall{height:clamp(360px,44vw,620px)}
.shot .tall img{width:100%}
.mark{position:absolute;left:3%;right:3%;top:57.3%;height:14%;border:3px solid var(--lime);border-radius:8px;pointer-events:none}
.step{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px Archivo,system-ui,sans-serif;color:var(--ink)}
.path[data-mode=prev] .shot.obs{opacity:.28}
.path[data-mode=prev] .shot.p{outline-color:var(--lime)}
.path[data-mode=obs] .shot{outline-color:var(--pink)}
.seg{display:inline-flex;background:var(--raised);border-radius:999px;padding:4px;gap:4px;margin:32px 0 12px}
.seg button{min-height:44px;border:0;border-radius:999px;padding:8px 20px;font:700 15px Archivo,sans-serif;background:transparent;color:var(--fg);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--lime);color:var(--ink)}
.seg button.o[aria-pressed=true]{background:var(--pink)}
.route{font:700 clamp(17px,2vw,22px)/1.4 Archivo,sans-serif}
/* 02 */
.bars{display:grid;gap:14px;margin:24px 0}
.bar{display:grid;grid-template-columns:minmax(0,22em) minmax(0,1fr) 2ch;gap:16px;align-items:center}
.bar i{display:block;height:28px;border-radius:4px;background:var(--pink);width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.bar.na i{background:var(--muted)}
.bar b{font:700 22px Archivo,system-ui,sans-serif;text-align:right}
.sit h3{margin:12px 0 10px}.sit .big{font-size:48px}
.sit.focus{outline:2px solid var(--lime);outline-offset:-2px}
.sit .top{display:flex;justify-content:space-between;align-items:center}
/* 03 */
.emb{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px}
.emb figure,.alts figure{margin:0;display:grid;gap:12px;align-content:start}
.emb img{border-radius:8px;width:100%}
table{width:100%;border-collapse:collapse;margin-top:24px}
th{font:400 13px Archivo,system-ui,sans-serif;color:var(--muted);text-align:left;padding:12px 20px}
td{padding:16px 20px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:700;width:30%}
.rec{background:var(--lime);color:var(--ink);border-radius:8px;padding:clamp(24px,3.5vw,40px);margin-top:24px;display:grid;gap:12px}
.rec .s{font-size:clamp(24px,3vw,36px);line-height:1.2}
.rec small{font:600 14px Archivo,system-ui,sans-serif}
.jm{margin-top:72px}
.jgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;position:relative}
.stage{all:unset;cursor:pointer;background:var(--raised);border-radius:8px;padding:14px 10px;text-align:center;font:700 14px/1.3 Archivo,system-ui,sans-serif;display:grid;gap:4px;align-content:center;min-height:88px;transition:background .2s}
.stage span{color:var(--accent-text);font-size:13px}
.stage[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.curve{position:relative;height:240px;margin:8px 0}
.curve svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.band2{position:absolute;top:-104px;bottom:-8px;left:calc(100%/6);width:calc(100%/3);background:color-mix(in srgb,var(--pink) 14%,transparent);border-radius:8px;pointer-events:none}
.band2 em{position:absolute;bottom:8px;left:12px;font:700 12px Archivo,system-ui,sans-serif;font-style:normal;color:var(--accent-text);font-family:Archivo,system-ui,sans-serif}
.jdet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px;align-items:start}
.jdet .feel{font-family:Anton,sans-serif;font-size:32px;line-height:1.1}
/* 04 */
.alts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:24px}
.alts .frame{height:clamp(420px,48vw,640px);overflow:hidden;border-radius:8px}
.alts .frame img{width:100%}
/* 05 */
.cmp{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center}
.slider{position:relative;aspect-ratio:750/1575;max-height:720px;border-radius:12px;overflow:hidden;background:var(--raised);touch-action:pan-y}
.slider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.slider .after{clip-path:inset(0 0 0 var(--x,50%))}
.slider .handle{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;background:var(--lime);transform:translateX(-50%);pointer-events:none}
.slider .handle::after{content:"↔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font:700 18px Archivo,system-ui,sans-serif;border:1.5px solid var(--ink)}
.slider input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.slider .tag{position:absolute;top:12px}
.notes{display:grid;gap:24px}
.notes li{list-style:none;padding-left:20px;border-left:3px solid var(--c);display:grid;gap:4px}
.notes ul{margin:0;padding:0;display:grid;gap:24px}
.arr{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center;margin-top:24px}
.phone{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:375/667;background:#20226b}
.phone>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.phone .ov{position:absolute;inset:0;background:rgba(11,10,32,.68);opacity:0;transition:opacity .35s}
.phone>img.m{inset:auto 0 0 0;height:auto;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.phone.on .ov{opacity:1}.phone.on>img.m{transform:none}
/* fechamento */
.next{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px;border-top:1px solid var(--line);padding-top:32px;margin-top:48px}
@media(max-width:860px){.ficha{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3,.grid2,.emb,.cmp,.arr,.jdet{grid-template-columns:minmax(0,1fr)}
.path,.alts{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:16px;padding-bottom:8px}
.path>*,.alts>*{flex:0 0 78%;scroll-snap-align:start}
.bar{grid-template-columns:minmax(0,1fr) 2ch}.bar span{grid-column:1/-1}
.slider{max-width:340px}.phone{max-width:300px}}
@media(max-width:600px){.jgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.curve{display:none}.stage{min-height:64px}
table,tbody,tr,td{display:block}thead{display:none}td{padding:6px 0;border:0}tr{border-top:1px solid var(--line);padding:12px 0}td:first-child{width:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}


.amo{margin-top:24px;display:grid;gap:8px}
.ab{height:12px;border-radius:4px;background:var(--pink);overflow:hidden}
.ab i{display:block;height:100%;width:var(--w);background:var(--case);border-right:3px solid var(--bg)}
.words{display:grid;gap:4px}
.wb{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.wb li{display:grid;grid-template-columns:110px minmax(0,1fr) 48px;align-items:center;gap:12px;font-size:15px}
.wb i{display:block;height:14px;border-radius:4px;background:linear-gradient(90deg,var(--case) var(--w),color-mix(in srgb,var(--fg) 10%,transparent) var(--w))}
.wb li:first-child b,.wb li:first-child span{color:var(--pink)}
.wb li:first-child i{background:linear-gradient(90deg,var(--pink) var(--w),color-mix(in srgb,var(--fg) 10%,transparent) var(--w))}
.wb span{text-align:right;font-weight:700}
.qt{margin:16px 0 0;padding:16px 20px;border-left:6px solid var(--case);background:var(--raised);border-radius:0 8px 8px 0;font:400 clamp(18px,1.7vw,20px)/1.4 Archivo,sans-serif}
.qt cite{display:block;margin-top:10px;font:600 13px/1.4 Archivo,sans-serif;font-style:normal;color:var(--muted)}
.grifo{background:var(--hl);color:var(--ink);padding:0 .15em;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.vw{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.vw li{font:600 13px/1 Archivo,sans-serif;padding:7px 10px;border-radius:999px;background:color-mix(in srgb,var(--fg) 10%,transparent)}
.vw li.on{background:var(--case);color:var(--ink)}
@media(max-width:600px){.wb li{grid-template-columns:96px minmax(0,1fr) 40px}}

/* 01 · caminho previsto e observado, tudo numa tela */
.inv{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:clamp(32px,4vw,56px);align-items:center}
.inv .head{margin-bottom:0}
.inv .seg{margin:24px 0 16px}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0;padding:0;list-style:none;font:600 14px/1.3 Archivo,sans-serif}
.steps li{padding:6px 12px;border-radius:999px;background:var(--raised)}
.steps li.sep{padding:0;background:none;color:var(--muted)}
.scr3{--sh:min(440px,calc(100vh - 300px));display:flex;justify-content:flex-end;gap:16px;align-items:flex-start}
.scr3 figure{margin:0;display:flex;flex-direction:column;gap:10px;flex:none;transition:opacity .3s}
.scr3 .shot{position:relative;height:var(--sh);border-radius:12px;overflow:hidden;box-shadow:0 14px 32px -18px #000}
.scr3 .shot img{height:100%;width:auto;max-width:none}
.scr3 figcaption{width:0;min-width:100%;font-size:14px;line-height:1.4}
.scr3[data-mode=prev] .f-conta{opacity:.28}
.hs{position:absolute;border:4px solid var(--c);border-radius:10px;box-shadow:0 5px 0 #090909;opacity:0;transform:scale(1.05);transition:opacity .3s,transform .3s;pointer-events:none}
.scr3[data-mode=prev] .hs.prev,.scr3[data-mode=obs] .hs.obs{opacity:1;transform:none}
.badge{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px Archivo,sans-serif;color:var(--ink);background:var(--c);transition:background .3s}
.badge:empty{display:none}
/* 02 · fontes e pizza */
.src{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.src .panel{display:grid;gap:8px;align-content:start}
.src .plate{width:52px;height:52px;margin-bottom:8px;box-shadow:0 4px 0 var(--ink)}.src .plate svg{width:28px;height:28px}
.pie{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center;margin-top:20px}
.pie svg{width:100%;height:auto;overflow:visible}
.pie path{stroke:var(--raised);stroke-width:4;stroke-linejoin:round;transition:opacity .25s,transform .25s;transform-origin:100px 100px;transform-box:view-box}
.pie svg.dim path:not(.on){opacity:.25}
.pie path.on{transform:scale(1.04)}
.pie g{transform:scale(.6) rotate(-40deg);transform-origin:100px 100px;opacity:0;transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .6s}
.pie.go g{transform:none;opacity:1}
.leg{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.leg button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:14px minmax(0,1fr) 5ch;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;font:400 17px/1.35 Archivo,sans-serif}
.leg button:hover,.leg button:focus-visible{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.leg button:focus-visible{outline:3px solid var(--focus);outline-offset:0}
.leg i{width:14px;height:14px;border-radius:4px;background:var(--c)}
.leg b{font:700 20px Archivo,sans-serif;text-align:right}
/* 03 · embalagem com zoom, cards com espaçamento único */
.emb2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.emb2 figure{margin:0;display:grid;gap:12px;align-content:start}
.thumb{all:unset;box-sizing:border-box;position:relative;display:block;height:180px;border-radius:8px;overflow:hidden;cursor:zoom-in;background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.top{background:#f5f4fa}.thumb.top img{object-fit:contain}
.thumb__tag{position:absolute;right:10px;bottom:10px;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--paper);font:700 13px Archivo,sans-serif}
.thumb:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.zoom{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;overflow:visible}
.zoom::backdrop{background:rgba(9,9,9,.86)}
.zoom img{display:block;max-width:min(94vw,1400px);max-height:88vh;width:auto;height:auto;border-radius:8px}
.zoom p{margin:12px 0 0;color:#f4f1db;font:400 14px Archivo,sans-serif;max-width:none}
.zoom__x{position:fixed;top:16px;right:16px;width:48px;height:48px;border-radius:999px;border:3px solid #858585;background:#1c2027;color:#f4f1db;font:700 22px/1 Archivo,sans-serif;cursor:pointer}
.zoom__x:focus-visible{outline:3px solid #a9bcff;outline-offset:3px}
/* jornada */
.jm{margin-top:48px}
.jchart{position:relative;margin-top:16px}
.jchart svg{display:block;width:100%;height:200px;overflow:visible}
.jgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:8px}
.jdet{margin-top:16px}
/* 04 · hierarquia */
.hier{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:clamp(32px,5vw,72px);align-items:center}
.hier .head{margin-bottom:24px}
.tasks{display:grid;gap:12px}
.tasks .panel{padding:16px 20px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.pscroll{height:min(540px,calc(100vh - 290px));overflow-y:auto;border-radius:16px;background:var(--raised);scrollbar-width:thin;box-shadow:0 14px 32px -18px #000}
.pscroll img{width:100%}
/* 05 · decisão */
.dec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,4vw,56px);align-items:center}
.dec .head{margin-bottom:24px}
.dec-ph{display:flex;gap:clamp(16px,2vw,24px)}
.dec figure{margin:0;display:grid;gap:10px;justify-items:start;flex:none}
.dec .shot{position:relative;height:min(560px,calc(100vh - 220px));border-radius:16px;overflow:hidden;box-shadow:0 14px 32px -18px #000}
.dec .shot>img{height:100%;width:auto;max-width:none}
.dec .ov{position:absolute;inset:0;background:rgba(11,10,32,.68);opacity:0;transition:opacity .35s}
.dec .shot>img.m{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.dec .shot.on .ov{opacity:1}.dec .shot.on .m{transform:none}
.dec .notes ul{gap:14px}.dec .notes li{font-size:16px}
@media(max-width:1100px){
 .inv,.hier{grid-template-columns:minmax(0,1fr)}
 .scr3{justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
 .scr3 figure{scroll-snap-align:start}
 .dec{grid-template-columns:minmax(0,1fr)}.dec-ph{overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}.dec figure{scroll-snap-align:start}
}
@media(max-width:860px){.src,.pie,.emb2{grid-template-columns:minmax(0,1fr)}.pie svg{max-width:240px}.hier .pscroll{max-width:340px}}
@media(max-width:600px){.scr3{--sh:420px}.dec .shot{height:440px}
 .jgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.jchart svg{display:none}}

:root{--case:var(--blue);--rec-ast:var(--pink)}

/* Padrões de case: cor principal, título, recomendação em placa, placas com pictograma, próximo case */
h1{font-size:clamp(40px,5.6vw,72px);max-width:20ch}
.band{padding-block:clamp(56px,6vw,88px)}
.stagebox{background:var(--case)}
.rec{position:relative;overflow:hidden;background:var(--case);color:var(--ink);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);border-radius:8px;padding-right:clamp(24px,22%,260px)!important}
.rec::after{content:"*";position:absolute;right:clamp(8px,3%,40px);top:50%;transform:translateY(-38%);font:400 clamp(180px,22vw,320px)/1 Anton,Impact,sans-serif;color:var(--rec-ast,var(--pink));pointer-events:none}
.rec>*{position:relative;z-index:1}
.rec .s{font:400 clamp(28px,3.4vw,44px)/1.1 Anton,Impact,sans-serif;text-wrap:balance}
@media(max-width:600px){.rec{padding-right:24px!important;padding-top:120px!important}.rec::after{top:-10px;right:16px;transform:none;font-size:180px}}
.rec p{color:var(--ink)}
.plate{display:grid;place-items:center;width:64px;height:64px;margin-bottom:20px;border-radius:8px;background:var(--case);color:var(--ink);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.plate svg{width:34px;height:34px}
.stack{display:grid;gap:24px}
.case-next{background:var(--next);color:var(--ink);border-top:3px solid var(--ink);padding:clamp(48px,7vw,96px) var(--gutter)}
.case-next__in{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px 32px;color:inherit;text-decoration:none}
.case-next__lbl{grid-column:1/-1;font:700 14px/1.4 Archivo,sans-serif}
.case-next__brand{grid-column:1;font:700 18px/1.3 Archivo,sans-serif}
.case-next__t{grid-column:1;font:400 clamp(36px,5vw,64px)/1.05 Anton,Impact,sans-serif;text-wrap:balance}
.case-next__btn{grid-column:2;grid-row:2/span 2;align-self:end;--btn-edge:#090909;background:#090909;color:#f4f1db;border-color:#090909;box-shadow:0 var(--v) 0 rgba(9,9,9,.4)}
.case-next__in:hover .case-next__btn{--v:4px}
.case-next__in:focus-visible{outline:3px solid #090909;outline-offset:8px;border-radius:8px}
@media(max-width:700px){.case-next__in{grid-template-columns:minmax(0,1fr)}.case-next__btn{grid-column:1;grid-row:auto;justify-self:start;margin-top:12px}}

/* placas pequenas: vocabulário de métodos */
.plate.sm{width:32px;height:32px;margin:0;flex:none;border-width:2px;box-shadow:0 3px 0 var(--ink)}
.plate.sm svg{width:18px;height:18px}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mlist li{display:flex;align-items:center;gap:10px;font:700 15px/1.3 Archivo,sans-serif}

/* alvos de toque no topo */
.cm-sig{min-height:44px;display:inline-flex;align-items:center}
.cm-menu a{min-height:44px;display:inline-flex;align-items:center;padding-inline:4px}

.leg button{min-height:44px}</style>
<style data-page="tesouro" media="not all">
/* VOICE: portfólio de Carlos, editorial e direto, primeira pessoa
   IDEA: um caso de investigação contado na ordem em que foi descoberto
   PICTURE: as telas reais do app, com caminho, comparação e aviso interativos
   COLOUR and TYPE: DS CM (night, paper, lime, pink, blue) · Anton + Archivo
   LAYOUT: bandas largas, conteúdo até var(--max), capítulos com divisória */
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip}
img{display:block;max-width:100%}
.wrap{max-width:var(--max);margin:0 auto}
.band{padding:clamp(56px,8vw,112px) var(--gutter);border-top:1px solid var(--line)}
h1,h2,.big{font-family:Anton,Impact,sans-serif;font-weight:400;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(44px,7vw,88px);max-width:16ch}
h2{font-size:clamp(32px,4.2vw,48px);max-width:22ch}
h3{font:700 22px/1.3 Archivo,sans-serif;margin:0}
p{margin:0;max-width:68ch}
.kick{font:600 14px/1.3 Archivo,sans-serif;color:var(--accent-text);margin-bottom:16px}
.lead{font-size:clamp(19px,1.6vw,22px);max-width:40em}
.cap{font-size:13px;color:var(--muted)}
.mut{color:var(--muted)}
.head{display:grid;gap:16px;margin-bottom:48px}
.panel{background:var(--raised);border-radius:8px;padding:clamp(20px,2.5vw,32px)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 14px;font:700 14px/1.2 Archivo,sans-serif;color:var(--ink);white-space:nowrap}
.seg button:focus-visible,.stage:focus-visible{outline:none;box-shadow:0 4px 0 var(--blue),0 0 0 2px var(--blue)}
/* hero */
.hero{padding:clamp(40px,6vw,72px) var(--gutter) clamp(56px,7vw,96px)}
.hero .wrap{display:grid;gap:32px}
.ficha{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;border-top:1px solid var(--line);padding-top:20px}
.ficha dt{font-size:13px;color:var(--muted);margin-bottom:6px}.ficha dd{margin:0;font:700 15px/1.4 Archivo,sans-serif}
.stagebox{background:var(--pink);border-radius:8px;height:clamp(340px,42vw,560px);overflow:hidden;display:flex;justify-content:center;gap:clamp(16px,4vw,48px);padding-top:clamp(32px,5vw,64px)}
.stagebox img{width:clamp(130px,22vw,300px);height:auto;border-radius:16px;box-shadow:0 24px 48px rgba(9,9,9,.35);align-self:flex-start}
/* 01 */
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:stretch}
.shot{display:flex;flex-direction:column;gap:16px;transition:opacity .3s,outline-color .3s;outline:2px solid transparent;outline-offset:-2px}
.shot .frame{position:relative;border-radius:8px;overflow:hidden}
.shot .tall{height:clamp(360px,44vw,620px)}
.shot .tall img{width:100%}
.mark{position:absolute;left:3%;right:3%;top:57.3%;height:14%;border:3px solid var(--lime);border-radius:8px;pointer-events:none}
.step{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px Archivo,system-ui,sans-serif;color:var(--ink)}
.path[data-mode=prev] .shot.obs{opacity:.28}
.path[data-mode=prev] .shot.p{outline-color:var(--lime)}
.path[data-mode=obs] .shot{outline-color:var(--pink)}
.seg{display:inline-flex;background:var(--raised);border-radius:999px;padding:4px;gap:4px;margin:32px 0 12px}
.seg button{min-height:44px;border:0;border-radius:999px;padding:8px 20px;font:700 15px Archivo,sans-serif;background:transparent;color:var(--fg);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--lime);color:var(--ink)}
.seg button.o[aria-pressed=true]{background:var(--pink)}
.route{font:700 clamp(17px,2vw,22px)/1.4 Archivo,sans-serif}
/* 02 */
.bars{display:grid;gap:14px;margin:24px 0}
.bar{display:grid;grid-template-columns:minmax(0,22em) minmax(0,1fr) 2ch;gap:16px;align-items:center}
.bar i{display:block;height:28px;border-radius:4px;background:var(--pink);width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.bar.na i{background:var(--muted)}
.bar b{font:700 22px Archivo,system-ui,sans-serif;text-align:right}
.sit h3{margin:12px 0 10px}.sit .big{font-size:48px}
.sit.focus{outline:2px solid var(--lime);outline-offset:-2px}
.sit .top{display:flex;justify-content:space-between;align-items:center}
/* 03 */
.emb{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px}
.emb figure,.alts figure{margin:0;display:grid;gap:12px;align-content:start}
.emb img{border-radius:8px;width:100%}
table{width:100%;border-collapse:collapse;margin-top:24px}
th{font:400 13px Archivo,system-ui,sans-serif;color:var(--muted);text-align:left;padding:12px 20px}
td{padding:16px 20px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:700;width:30%}
.rec{background:var(--lime);color:var(--ink);border-radius:8px;padding:clamp(24px,3.5vw,40px);margin-top:24px;display:grid;gap:12px}
.rec .s{font-size:clamp(24px,3vw,36px);line-height:1.2}
.rec small{font:600 14px Archivo,system-ui,sans-serif}
.jm{margin-top:72px}
.jgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;position:relative}
.stage{all:unset;cursor:pointer;background:var(--raised);border-radius:8px;padding:14px 10px;text-align:center;font:700 14px/1.3 Archivo,system-ui,sans-serif;display:grid;gap:4px;align-content:center;min-height:88px;transition:background .2s}
.stage span{color:var(--accent-text);font-size:13px}
.stage[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.curve{position:relative;height:240px;margin:8px 0}
.curve svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.band2{position:absolute;top:-104px;bottom:-8px;left:calc(100%/6);width:calc(100%/3);background:color-mix(in srgb,var(--pink) 14%,transparent);border-radius:8px;pointer-events:none}
.band2 em{position:absolute;bottom:8px;left:12px;font:700 12px Archivo,system-ui,sans-serif;font-style:normal;color:var(--accent-text);font-family:Archivo,system-ui,sans-serif}
.jdet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px;align-items:start}
.jdet .feel{font-family:Anton,sans-serif;font-size:32px;line-height:1.1}
/* 04 */
.alts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:24px}
.alts .frame{height:clamp(420px,48vw,640px);overflow:hidden;border-radius:8px}
.alts .frame img{width:100%}
/* 05 */
.cmp{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center}
.slider{position:relative;aspect-ratio:750/1575;max-height:720px;border-radius:12px;overflow:hidden;background:var(--raised);touch-action:pan-y}
.slider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.slider .after{clip-path:inset(0 0 0 var(--x,50%))}
.slider .handle{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;background:var(--lime);transform:translateX(-50%);pointer-events:none}
.slider .handle::after{content:"↔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font:700 18px Archivo,system-ui,sans-serif;border:1.5px solid var(--ink)}
.slider input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.slider .tag{position:absolute;top:12px}
.notes{display:grid;gap:24px}
.notes li{list-style:none;padding-left:20px;border-left:3px solid var(--c);display:grid;gap:4px}
.notes ul{margin:0;padding:0;display:grid;gap:24px}
.arr{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center;margin-top:24px}
.phone{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:375/667;background:#20226b}
.phone>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.phone .ov{position:absolute;inset:0;background:rgba(11,10,32,.68);opacity:0;transition:opacity .35s}
.phone>img.m{inset:auto 0 0 0;height:auto;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.phone.on .ov{opacity:1}.phone.on>img.m{transform:none}
/* fechamento */
.next{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px;border-top:1px solid var(--line);padding-top:32px;margin-top:48px}
@media(max-width:860px){.ficha{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3,.grid2,.emb,.cmp,.arr,.jdet{grid-template-columns:minmax(0,1fr)}
.path,.alts{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:16px;padding-bottom:8px}
.path>*,.alts>*{flex:0 0 78%;scroll-snap-align:start}
.bar{grid-template-columns:minmax(0,1fr) 2ch}.bar span{grid-column:1/-1}
.slider{max-width:340px}.phone{max-width:300px}}
@media(max-width:600px){.jgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.curve{display:none}.stage{min-height:64px}
table,tbody,tr,td{display:block}thead{display:none}td{padding:6px 0;border:0}tr{border-top:1px solid var(--line);padding:12px 0}td:first-child{width:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}


/* Tesouro Direto: espaços das capturas ainda não recebidas */
.ph{display:grid;place-items:center;width:100%;aspect-ratio:300/650;padding:16px;text-align:center;border-radius:12px;border:2px dashed color-mix(in srgb,var(--fg) 35%,transparent);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--fg) 6%,transparent) 0 10px,transparent 10px 20px);color:var(--muted);font:600 13px/1.4 Archivo,sans-serif}
.ph b{display:block;margin-bottom:4px;color:var(--fg);font-size:14px}
.stagebox .ph{width:clamp(130px,22vw,240px);align-self:flex-start;background-color:var(--bg)}
.td-bars .bar{grid-template-columns:minmax(0,22em) minmax(0,1fr) 6ch}
.tdimg{display:block;width:100%;height:auto}
.path .frame{height:auto}
.stagebox .tdimg{width:clamp(130px,22vw,300px);border-radius:16px;box-shadow:0 24px 48px rgba(9,9,9,.35);align-self:flex-start}
.scr .tdimg{border-radius:12px}
.smap{height:min(560px,calc(100vh - 240px));overflow-y:auto;border-radius:12px;background:var(--bg);scrollbar-width:thin}
.smap img{display:block;width:100%;height:auto}
.smap:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.td-bars .bar[style] i{background:var(--bc)}
.sevt td:nth-child(2){width:1%;white-space:nowrap}
.sev{display:inline-flex;align-items:center;gap:10px}
.sev__m{display:inline-flex;gap:3px}
.sev__m i{width:10px;height:22px;border-radius:3px;background:color-mix(in srgb,var(--fg) 14%,transparent)}
.sev2 .sev__m i:nth-child(-n+2){background:var(--blue)}
.sev3 .sev__m i:nth-child(-n+3){background:var(--lime)}
.sev4 .sev__m i{background:var(--pink)}
.sev b{font:700 14px Archivo,sans-serif}
@media(max-width:600px){.sevt td:nth-child(2){white-space:normal}}
.paths{display:grid;gap:16px;margin-top:24px}
.paths div{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;font:700 clamp(17px,2vw,22px)/1.4 Archivo,sans-serif}
.chg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:24px}
.chg figure{margin:0;display:grid;gap:16px;align-content:start}
.scr-row{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:end}
.scr{position:relative}
.ins{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:clamp(32px,4vw,56px);align-items:center}
.ins .head{margin-bottom:0}.ins .seg{margin:24px 0 16px}
.ins3{--sh:min(460px,calc(100vh - 300px));display:flex;justify-content:flex-end;gap:16px;align-items:flex-start}
.ins3 figure{margin:0;display:flex;flex-direction:column;gap:10px;flex:none;transition:opacity .3s}
.ins3 figcaption{width:0;min-width:100%;font-size:14px;line-height:1.4}
.shot2{position:relative;height:var(--sh);aspect-ratio:828/1792;border-radius:12px;box-shadow:0 0 0 4px var(--c,transparent),0 14px 32px -18px #000;transition:box-shadow .3s}
.shot2 .tdimg{height:100%;width:100%;border-radius:12px}
.ins3[data-mode=obs] .shot2{--c:var(--pink)}
.ins3[data-mode=exp] .f1 .shot2,.ins3[data-mode=exp] .f3 .shot2{--c:var(--lime)}
.ins3[data-mode=exp] .f2{opacity:.28}
.ins3 .badge{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px Archivo,sans-serif;color:#090909;background:var(--c,#b9bdc6)}
.ins3 .badge:empty{display:none}
.chg-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:24px}.chg-head .head{margin:0}.chg-head .btn{flex:none}
.chg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.cf{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
.cf-shot{position:relative;height:min(440px,calc(100vh - 400px));aspect-ratio:828/1792}
.cf-shot .tdimg{height:100%;width:100%;border-radius:12px}
.cf-txt{display:grid;gap:16px;align-content:start}
.cf-txt .notes ul{gap:12px}.cf-txt .notes li{font-size:15px;line-height:1.45}
.prop{display:grid;gap:4px;padding:12px 14px;border-radius:8px;background:color-mix(in srgb,var(--fg) 6%,transparent);box-shadow:inset 4px 0 0 var(--case);font-size:15px;line-height:1.45}
.prop small{font:700 13px Archivo,sans-serif;color:var(--accent-text)}
.chg2.on .hx{opacity:1;transform:none}
.rec.mini{padding:20px 22px!important;padding-right:clamp(24px,26%,160px)!important;margin:0}
.rec.mini .s{font-size:clamp(24px,2.6vw,32px)}
.rec.mini::after{font-size:clamp(120px,12vw,180px)}
@media(max-width:1100px){.ins{grid-template-columns:minmax(0,1fr)}.ins3{justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 8px}.ins3 figure{scroll-snap-align:start}.chg2{grid-template-columns:minmax(0,1fr)}.chg-head{flex-direction:column;align-items:flex-start}}
@media(max-width:600px){.ins3{--sh:420px}.cf{grid-template-columns:minmax(0,1fr)}.cf-shot{height:auto;width:min(100%,280px)}}
.hx{position:absolute;border:4px solid var(--c);border-radius:10px;box-shadow:0 5px 0 #090909;opacity:0;transform:scale(1.06);transition:opacity .3s,transform .3s;pointer-events:none}
.chg.on .hx{opacity:1;transform:none}
.chg .notes ul{gap:16px}
.chg .notes li{font-size:15px;line-height:1.5}
.disc{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center;margin-top:24px}
@media(max-width:860px){.chg,.scr-row,.disc{grid-template-columns:minmax(0,1fr)}.scr,.disc .ph{max-width:300px}.td-bars .bar{grid-template-columns:minmax(0,1fr) 6ch}}

:root{--case:var(--lime);--rec-ast:var(--pink)}

/* Padrões de case: cor principal, título, recomendação em placa, placas com pictograma, próximo case */
h1{font-size:clamp(40px,5.6vw,72px);max-width:20ch}
.band{padding-block:clamp(56px,6vw,88px)}
.stagebox{background:var(--case)}
.rec{position:relative;overflow:hidden;background:var(--case);color:var(--ink);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);border-radius:8px;padding-right:clamp(24px,22%,260px)!important}
.rec::after{content:"*";position:absolute;right:clamp(8px,3%,40px);top:50%;transform:translateY(-38%);font:400 clamp(180px,22vw,320px)/1 Anton,Impact,sans-serif;color:var(--rec-ast,var(--pink));pointer-events:none}
.rec>*{position:relative;z-index:1}
.rec .s{font:400 clamp(28px,3.4vw,44px)/1.1 Anton,Impact,sans-serif;text-wrap:balance}
@media(max-width:600px){.rec{padding-right:24px!important;padding-top:120px!important}.rec::after{top:-10px;right:16px;transform:none;font-size:180px}}
.rec p{color:var(--ink)}
.plate{display:grid;place-items:center;width:64px;height:64px;margin-bottom:20px;border-radius:8px;background:var(--case);color:var(--ink);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.plate svg{width:34px;height:34px}
.stack{display:grid;gap:24px}
.case-next{background:var(--next);color:var(--ink);border-top:3px solid var(--ink);padding:clamp(48px,7vw,96px) var(--gutter)}
.case-next__in{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px 32px;color:inherit;text-decoration:none}
.case-next__lbl{grid-column:1/-1;font:700 14px/1.4 Archivo,sans-serif}
.case-next__brand{grid-column:1;font:700 18px/1.3 Archivo,sans-serif}
.case-next__t{grid-column:1;font:400 clamp(36px,5vw,64px)/1.05 Anton,Impact,sans-serif;text-wrap:balance}
.case-next__btn{grid-column:2;grid-row:2/span 2;align-self:end;--btn-edge:#090909;background:#090909;color:#f4f1db;border-color:#090909;box-shadow:0 var(--v) 0 rgba(9,9,9,.4)}
.case-next__in:hover .case-next__btn{--v:4px}
.case-next__in:focus-visible{outline:3px solid #090909;outline-offset:8px;border-radius:8px}
@media(max-width:700px){.case-next__in{grid-template-columns:minmax(0,1fr)}.case-next__btn{grid-column:1;grid-row:auto;justify-self:start;margin-top:12px}}

/* placas pequenas: vocabulário de métodos */
.plate.sm{width:32px;height:32px;margin:0;flex:none;border-width:2px;box-shadow:0 3px 0 var(--ink)}
.plate.sm svg{width:18px;height:18px}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mlist li{display:flex;align-items:center;gap:10px;font:700 15px/1.3 Archivo,sans-serif}

/* contexto: adoção */
.adopt{display:grid;gap:14px;margin-top:8px}
.adopt .row{display:grid;grid-template-columns:minmax(0,16em) minmax(0,1fr) 7ch;gap:16px;align-items:center}
.adopt i{display:block;height:28px;border-radius:4px;background:var(--bc);width:0;min-width:4px;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.adopt b{font:700 22px Archivo,sans-serif;text-align:right}
.adopt .td span,.adopt .td b{font-weight:700}
.readmore{margin:24px 0 0;max-width:none}
.readmore a{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--fg);font:700 17px Archivo,sans-serif;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.readmore a:hover{color:var(--accent-text)}
.adopt .td b{font-size:26px}
.adopt .flag{grid-column:2/-1;font:700 14px/1.3 Archivo,sans-serif;font-style:normal}
/* problemas fora da consulta */
.more3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.more3 .panel{display:grid;gap:8px;align-content:start}
.more3 .thumb{margin-bottom:12px}
.more3 .thumb.top{background:var(--bg)}.more3 .thumb.top img{object-fit:cover;object-position:50% 0}
.more3 .plate{width:52px;height:52px;margin-bottom:8px;box-shadow:0 4px 0 var(--ink)}.more3 .plate svg{width:28px;height:28px}
/* DIBB */
.dibb{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;list-style:none;margin:0;padding:0;counter-reset:d}
.dibb::before{content:"";position:absolute;left:32px;right:32px;top:31px;height:4px;border-radius:4px;background:var(--case)}
.dibb li{position:relative;display:grid;gap:8px;align-content:start}
.dibb .plate{width:64px;height:64px;margin-bottom:12px;position:relative}
.dibb h3 small{display:block;font:700 13px Archivo,sans-serif;color:var(--accent-text);margin-bottom:2px}
.dibb p{font-size:16px;line-height:1.5}
/* benchmark */
.bm td,.bm th{text-align:left}
.bm td:not(:first-child){white-space:nowrap}
.yes,.no,.foot{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.yes::before,.no::before,.foot::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.yes{--c:var(--lime)}.no{--c:color-mix(in srgb,var(--fg) 25%,transparent);font-weight:400;color:var(--muted)}.foot{--c:var(--pink)}
.bm tr.td td{background:color-mix(in srgb,var(--pink) 10%,transparent)}
@media(max-width:860px){.more3,.dibb{grid-template-columns:minmax(0,1fr)}.dibb::before{left:30px;right:auto;top:32px;bottom:32px;width:4px;height:auto}.adopt .row{grid-template-columns:minmax(0,1fr) 7ch}.adopt .row span{grid-column:1/-1}.bm td:not(:first-child){white-space:normal}}

.thumb{all:unset;box-sizing:border-box;position:relative;display:block;height:180px;border-radius:8px;overflow:hidden;cursor:zoom-in;background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.top{background:#f5f4fa}.thumb.top img{object-fit:contain}
.thumb__tag{position:absolute;right:10px;bottom:10px;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--paper);font:700 13px Archivo,sans-serif}
.thumb:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.zoom{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;overflow:visible}
.zoom::backdrop{background:rgba(9,9,9,.86)}
.zoom img{display:block;max-width:min(94vw,1400px);max-height:88vh;width:auto;height:auto;border-radius:8px}

<div>
<div class="head"><div class="kick">01 · Investigação</div><h2>Onde o cliente procurava a ativação</h2>
<p>No teste de usabilidade do novo app, observei a tarefa de ativar o adesivo. Em vez de usar o atalho previsto, o card “Meus produtos” na home, os participantes faziam um caminho maior: abriam “Minha conta”, na navegação inferior, para procurar o adesivo. Os cards coloridos da home eram notados e logo esquecidos. O de “Meus produtos” nem parecia clicável.</p></div>

<h3 style="margin:56px 0 24px">Três situações diferentes apareceram na síntese</h3>
<div class="grid3">
<div class="panel sit"><div class="big">1</div><h3>Não sabiam que era preciso ativar</h3><p>Algumas pessoas desconheciam a exigência de ativar a tag antes de usar.</p></div>
<div class="panel sit focus"><div class="top"><div class="big" style="color:var(--lime)">2</div><span class="pill" style="background:var(--lime)">Foco da home</span></div><h3>Sabiam, mas não achavam a função</h3><p>Outras sabiam que precisavam ativar e procuravam o comando no app.</p></div>
<div class="panel sit"><div class="big">3</div><h3>Chegavam lá e a opção não estava disponível</h3><p>Uma regra do app escondia “Ativar produto” quando o sistema não tinha pedido de adesivo daquele cliente.</p></div>
</div>
<p class="mut" style="margin-top:24px">Dar destaque à ativação na home ajudaria principalmente o segundo grupo. As três situações vêm da síntese qualitativa e não correspondem a parcelas das ligações ouvidas.</p>
</div></section>

<section class="band" id="nome"><div class="wrap">
<div class="head"><div class="kick">03 · Arquitetura da informação</div><h2>Por que recomendei “Ativar adesivo”</h2>
<p>Cada ponto de contato chamava a tarefa de um jeito. A embalagem dizia “Ative a tag pelo aplicativo ou site”. No app, a pessoa encontrava “Meus produtos” e depois “Ativar produto”.</p></div>
<div class="stack">
<div class="emb2">
<figure class="panel"><button class="thumb" type="button" data-zoom aria-label="Ampliar a foto da embalagem"><img loading="lazy" decoding="async" src="assets/img/abde0f280b48.jpg" alt="Interior da embalagem com a instrução Ative a tag pelo aplicativo ou site"><span class="thumb__tag">Ampliar</span></button><figcaption><b>Embalagem</b><br><span class="cap">“Ative a tag pelo aplicativo ou site.” O último passo, “Aguarde até 6 horas para usar no pedágio”, foi lido por um cliente como o prazo da ativação.</span></figcaption></figure>
<figure class="panel"><button class="thumb top" type="button" data-zoom aria-label="Ampliar a tela Meus produtos"><img loading="lazy" decoding="async" src="assets/img/85bbbf4aeb1a.jpg" alt="Tela Meus produtos com o botão Ativar produto"><span class="thumb__tag">Ampliar</span></button><figcaption><b>App</b><br><span class="cap">“Meus produtos” leva a “Ativar produto”.</span></figcaption></figure>
</div>
<div class="panel" style="padding:8px">
<table><thead><tr><th>Canal</th><th>Como a tarefa aparecia</th></tr></thead><tbody>
<tr><td>Embalagem</td><td>“Ative a tag pelo aplicativo ou site”</td></tr>
<tr><td>App</td><td>“Meus produtos” e, depois, “Ativar produto”</td></tr>
<tr><td>Clientes nas ligações</td><td>“Ativar” foi o verbo mais usado (42%). 83% chamavam o objeto de “tag”.</td></tr>
<tr><td>Participantes do teste</td><td>Parte deles achava que “produto” era algo diferente do adesivo.</td></tr>
<tr><td>Atendentes</td><td>92% usaram “ativar” e “tag”.</td></tr>
<tr><td>Marketing</td><td>Havia escolhido “adesivo” como nome do produto.</td></tr>
</tbody></table></div>
<div class="panel words"><h3>Como os clientes chamavam a ação nas ligações</h3><p class="cap">Escuta de chamadas em dezembro de 2020</p><ul class="wb"><li style="--w:42%"><b>Ativar</b><i></i><span>42%</span></li><li style="--w:25%"><b>Cadastrar</b><i></i><span>25%</span></li><li style="--w:17%"><b>Habilitar</b><i></i><span>17%</span></li><li style="--w:17%"><b>Desbloquear</b><i></i><span>17%</span></li></ul><p class="mut" style="margin:16px 0 0">Para o objeto, 83% disseram “tag”.</p></div>
<div class="rec" style="margin-top:0"><small>Minha recomendação</small><div class="s">Padronizar a ação como “Ativar adesivo” em todos os canais.</div><p>“Ativar” era o verbo mais usado por clientes e atendentes. “Adesivo” era o nome do produto escolhido pelo Marketing.</p></div>
</div>
<div class="jm">
<h3>O percurso até o primeiro uso</h3>
<p class="cap" style="margin-top:6px">Toque numa etapa para ver o sentimento e as dores. A curva é qualitativa, não uma medida.</p>
<div class="jchart" id="jchart"><svg id="cv" role="img" aria-label="Curva de sentimento ao longo das seis etapas"></svg><div class="jgrid" id="stages"></div></div>
<div class="panel jdet" id="jdet" aria-live="polite"></div>
<p class="cap" style="margin-top:12px">Do entusiasmo no recebimento à confusão na ativação. A passagem da embalagem para o app concentrava as dores.</p>
</div>
</div></section>

<section class="band" id="home"><div class="wrap hier">
<div>
<div class="head"><div class="kick">04 · Hierarquia</div><h2>Que espaço a ativação deveria ocupar na home</h2>
<p>Testei com clientes três versões da home para decidir esse espaço. Quem acabava de receber a tag precisava encontrar uma ação que faria uma vez para aquele adesivo. Quem já usava a Veloe voltava para consultar gastos e saber onde a tag era aceita. Trabalhei na hierarquia dessas tarefas.</p></div>
<div class="tasks">
<div class="panel"><div class="kick" style="margin-bottom:4px">Tarefa pontual</div><h3>Ativar o adesivo recebido</h3><p class="mut" style="margin-top:4px">Feita uma vez por adesivo, logo depois da entrega.</p></div>
<div class="panel"><div class="kick" style="margin-bottom:4px">Tarefas recorrentes</div><h3>Consultar gastos e onde usar</h3><p class="mut" style="margin-top:4px">No teste de usabilidade, o extrato e o “Onde usar” foram as funções mais importantes.</p></div>
</div>
<blockquote class="qt">“Fico despreocupado, simplesmente passo na cancela e vou embora.”<cite>Participante do teste de usabilidade que usava o app com frequência</cite></blockquote><p style="margin-top:24px">Usei o <span class="grifo">Microsoft Reaction Card Method</span> em fevereiro de 2021: cada participante escolhia, numa lista de palavras, as que descreviam cada proposta. Ninguém escolheu palavras negativas.</p><p class="cap" style="margin-top:8px">A ordem das telas mudava a cada sessão. O teste avaliou percepção, não o desempenho na tarefa.</p>
</div>
<div>
<div class="pscroll" tabindex="0" aria-label="Tela da proposta; role para ver a home inteira"><img loading="lazy" decoding="async" id="altImg" src="assets/img/b29fa9eacd75.jpg" alt="Proposta 1, card em destaque"></div>
<div style="margin-top:16px"><div class="seg tabs" role="group" aria-label="Proposta exibida" id="alts"><button aria-pressed="true" data-i="0">1</button><button aria-pressed="false" data-i="1">2</button><button aria-pressed="false" data-i="2">3</button></div></div>
<p style="margin-top:12px"><b id="altT">1 · Card em destaque</b><br><span class="cap" id="altC">Cards brancos e ícones coloridos. A ativação ganha um card destacado. Role dentro da tela, para cima ou para baixo, para ver a home inteira.</span></p><ul class="vw" id="altW" aria-label="Palavras escolhidas pelos participantes"></ul><p class="cap" id="altN" style="margin-top:8px"></p><p class="cap" style="margin-top:4px">Em destaque, palavras escolhidas por mais de um participante.</p>
</div>
</div></section>

<section class="band" id="decisao"><div class="wrap dec">
<div>
<div class="head"><div class="kick">05 · Decisão</div><h2>Do card “Meus produtos” ao atalho “Ativar adesivo”</h2>
<p>Na home testada, o cliente precisava deduzir que a ativação estava em “Meus produtos”. Na proposta, a própria home passou a nomear a tarefa: “Ativar adesivo”. A versão final juntou o carrossel de atalhos da versão 2, elogiado por todos os participantes, com os cards coloridos da versão 3, que tiveram a reação mais positiva.</p></div>
<div class="notes"><ul>
<li style="--c:#b9bdc6"><b>Card “Meus produtos”</b><span class="mut">Na home anterior, a ativação ficava dentro dele e o cliente precisava deduzir isso.</span></li>
<li style="--c:var(--lime)"><b>Atalho “Ativar adesivo”</b><span class="mut">Na proposta, a home nomeia a tarefa entre os atalhos.</span></li>
<li style="--c:var(--blue)"><b>Resumo de consumo</b><span class="mut">Para quem já usava o serviço, tocar no resumo abria o extrato filtrado.</span></li>
<li style="--c:var(--pink)"><b>Aviso “Seu adesivo chegou!”</b><span class="mut">Um segundo ponto de entrada, com o botão “Ativar agora”, para quem acabava de receber a tag.</span></li>
</ul><button class="btn primary" id="bm" aria-pressed="false" style="margin-top:24px;justify-self:start">Mostrar o aviso de chegada</button></div>
</div>
<div class="dec-ph">
<figure><span class="pill" style="background:#b9bdc6">Antes</span><div class="shot"><img loading="lazy" decoding="async" src="assets/img/59c07e2e3c73.jpg" alt="Home anterior com o cabeçalho retraído"></div></figure>

<p class="lead">A B3 avaliava desativar o aplicativo em maio de 2024. Investiguei o que os investidores já faziam pelo app e o que perderiam se esse canal saísse do ar.</p>
<dl class="ficha">
