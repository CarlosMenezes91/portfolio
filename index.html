<section class="band" id="contexto"><div class="wrap">
<div class="head"><div class="kick">Contexto</div><h2>Um app quase invisível</h2>
<p>Em janeiro de 2024, o app do Tesouro Direto tinha média de 25 downloads por dia. Um app de investimento tinha, em média, 3.400. Antes de decidir pelo fim do canal, era preciso entender se a baixa adoção vinha de falta de interesse ou de outra coisa.</p></div>
<div class="panel">
<h3>Média de downloads por dia</h3><p class="cap">Fonte: AppBrain, janeiro de 2024</p>
<div class="adopt" id="adopt">
<div class="row"><span>Apps de investimento</span><i style="--bc:#b9bdc6" data-w="100"></i><b>3.400</b></div>
<div class="row"><span>Apps de gerenciamento de ativos</span><i style="--bc:#b9bdc6" data-w="4.2"></i><b>143</b></div>
<div class="row td"><span>App do Tesouro Direto</span><i style="--bc:var(--case)" data-w="0.74"></i><b>25</b><em class="flag">Menos de 1% da média dos apps de investimento</em></div>
</div>
</div>
</div></section>
<section class="band" id="dados"><div class="wrap">
<div class="head"><div class="kick">01 · Dados de uso</div><h2>O que os investidores voltavam para fazer</h2>
<p>Olhamos os registros dos usuários mais assíduos do app. Em três meses, 81,6% das ações desse grupo foram consultas.</p></div>
<div class="panel">
<h3>Ações registradas pelos usuários mais assíduos</h3><p class="cap">Extração da B3 de janeiro de 2024, com os três meses anteriores</p>
<div class="bars td-bars" id="barsA"></div>
<p class="cap">Percentual sobre o total de ações do grupo. Investimentos e resgates incluem os respectivos agendamentos.</p>
</div>
<h3 style="margin:56px 0 24px">O que os registros mostravam e o que não mostravam</h3>
<div class="grid3">
<div class="panel sit"><div class="big">1</div><h3>Consultar era o uso principal</h3><p>Acompanhar o próprio dinheiro respondia por quatro de cada cinco ações do grupo.</p></div>
<div class="panel sit"><div class="top"><div class="big">2</div><span class="pill" style="background:var(--lime)">Em aberto</span></div><h3>Por que o app e não o site?</h3><p>Restrições institucionais impediram o contato direto com investidores. O motivo da escolha pelo app ficou em aberto.</p></div>
<div class="panel sit"><div class="big">3</div><h3>Uma pista para a avaliação</h3><p>Se a consulta trazia as pessoas de volta, os problemas nesse fluxo mereciam atenção primeiro.</p></div>
</div>
<p class="mut" style="margin-top:24px">Sabíamos o que essas pessoas faziam com frequência. Os registros descrevem ações desse grupo, não de todos os investidores do Tesouro Direto.</p>
</div></section>

<section class="band" id="problemas"><div class="wrap">
<div class="head"><div class="kick">02 · Avaliação heurística</div><h2>Onde estavam os problemas</h2>
<p>Na avaliação de usabilidade, percorri os fluxos de acesso, investimento, consulta e resgate. Registrei 32 problemas, cada um com as heurísticas de Nielsen afetadas, um nível de gravidade e uma proposta. A consulta concentrava 11.</p></div>
<div class="panel">
<h3>Problemas registrados por etapa</h3><p class="cap">Avaliação heurística do app, janeiro de 2024</p>
<div class="bars td-bars" id="barsB"></div>
<p class="cap">A gravidade é um julgamento da avaliação. Os registros de uso não medem a frequência de cada problema.</p>
</div>
<div class="panel" style="padding:8px;margin-top:24px">
<table class="sevt"><thead><tr><th>Achado</th><th>Gravidade</th><th>O que observamos</th></tr></thead><tbody><tr><td>Consulta de resgate invisível</td><td data-l="Gravidade"><span class="sev sev4" role="img" aria-label="Gravidade 4 de 4, grave"><span class="sev__m"><i></i><i></i><i></i><i></i></span><b>Grave</b></span></td><td data-l="O que observamos">O resgate só aparecia depois de filtrar por “Resgate”.</td></tr><tr><td>Sem investimentos em liquidação</td><td data-l="Gravidade"><span class="sev sev3" role="img" aria-label="Gravidade 3 de 4, moderado"><span class="sev__m"><i></i><i></i><i></i><i></i></span><b>Moderado</b></span></td><td data-l="O que observamos">Investimentos ainda em liquidação não apareciam em Meus investimentos.</td></tr><tr><td>Consulta sem operação</td><td data-l="Gravidade"><span class="sev sev3" role="img" aria-label="Gravidade 3 de 4, moderado"><span class="sev__m"><i></i><i></i><i></i><i></i></span><b>Moderado</b></span></td><td data-l="O que observamos">Para quem não tinha operações, a mensagem não explicava o que fazer.</td></tr><tr><td>Sem atalho no feedback de resgate</td><td data-l="Gravidade"><span class="sev sev2" role="img" aria-label="Gravidade 2 de 4, leve"><span class="sev__m"><i></i><i></i><i></i><i></i></span><b>Leve</b></span></td><td data-l="O que observamos">A confirmação indicava Consultas, mas só oferecia “Fechar”.</td></tr><tr><td>Sem atalho no feedback de agendamento</td><td data-l="Gravidade"><span class="sev sev2" role="img" aria-label="Gravidade 2 de 4, leve"><span class="sev__m"><i></i><i></i><i></i><i></i></span><b>Leve</b></span></td><td data-l="O que observamos">O mesmo padrão aparecia ao agendar um investimento.</td></tr></tbody></table><p class="cap" style="padding:12px 20px 8px">Escala de gravidade de Nielsen, de 0 a 4.</p></div>
<h3 style="margin:56px 0 24px">Além da consulta: barreiras em outras etapas</h3>
<div class="more3">
<div class="panel"><button class="thumb " type="button" data-zoom aria-label="Ampliar: Fluxo de recuperação de senha, do app para o site"><img loading="lazy" decoding="async" src="assets/img/4e26e78a596b.jpg" alt="Fluxo de recuperação de senha, do app para o site"><span class="thumb__tag">Ampliar</span></button><span class="plate" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.63 2C18.16 2 22.64 6.5 22.64 12C22.64 17.5 18.16 22 12.63 22C9.12 22 6.05 20.18 4.26 17.43L5.84 16.18C7.25 18.47 9.76 20 12.64 20C14.76 20 16.79 19.15 18.29 17.65C19.79 16.15 20.64 14.12 20.64 12C20.64 9.87 19.79 7.84 18.29 6.34C16.79 4.84 14.76 4 12.64 4C8.56 4 5.2 7.06 4.71 11H7.47L3.73 14.73L0 11H2.69C3.19 5.95 7.45 2 12.63 2ZM15.59 10.24C16.09 10.25 16.5 10.65 16.5 11.16V15.77C16.5 16.27 16.09 16.69 15.58 16.69H10.05C9.54 16.69 9.13 16.27 9.13 15.77V11.16C9.13 10.65 9.54 10.25 10.04 10.24V9.23C10.04 7.7 11.29 6.46 12.81 6.46C14.34 6.46 15.59 7.7 15.59 9.23V10.24ZM12.81 7.86C12.06 7.86 11.44 8.47 11.44 9.23V10.24H14.19V9.23C14.19 8.47 13.57 7.86 12.81 7.86Z"/></svg></span><h3>Recuperação de senha</h3><p class="mut">O fluxo levava do app para o site sem explicação, interrompendo a jornada.</p></div>
<div class="panel"><button class="thumb top" type="button" data-zoom aria-label="Ampliar: Resumo da solicitação com o botão Confirmar"><img loading="lazy" decoding="async" src="assets/img/bd20f6e95349.jpg" alt="Resumo da solicitação com o botão Confirmar"><span class="thumb__tag">Ampliar</span></button><span class="plate" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5M11 7H13V13H11M11 15H13V17H11"/></svg></span><h3>Compra sem aviso</h3><p class="mut">O botão “Confirmar” não avisava que a compra não podia ser desfeita.</p></div>
<div class="panel"><button class="thumb top" type="button" data-zoom aria-label="Ampliar: Menu lateral do app com as categorias"><img loading="lazy" decoding="async" src="assets/img/1687ddb5ef3b.jpg" alt="Menu lateral do app com as categorias"><span class="thumb__tag">Ampliar</span></button><span class="plate" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 6H21V8H3V6ZM3 11H21V13H3V11ZM3 16H21V18H3V16Z"/></svg></span><h3>Menu confuso</h3><p class="mut">Categorias demais e hierarquia pouco clara dificultavam encontrar funções essenciais.</p></div>
</div>

</div></section>

<section class="band" id="resgate"><div class="wrap ins">
<div>
<div class="head"><div class="kick">03 · Inspeção</div><h2>Um resgate que só aparecia com o filtro</h2>
<p>Depois de agendar um resgate, segui a orientação da confirmação e abri Consulta. Na aba “Operações”, a lista inicial mostrava investimentos. Para ver o resgate, precisei abrir o filtro e selecionar “Resgate”. Quem parasse na primeira tela podia ficar em dúvida se o pedido tinha sido registrado.</p></div>
<div class="seg" role="group" aria-label="Caminho"><button id="tdE" aria-pressed="false">Esperado</button><button id="tdN" class="o" aria-pressed="true">Necessário</button></div>
<p class="route" id="tdRoute">Fechar → menu → Consulta → filtro → “Resgate” → resgate na lista</p>
<p class="cap" style="margin-top:12px">Capturas feitas durante a inspeção, em janeiro de 2024.</p>
</div>
<div class="ins3" id="tdPath" data-mode="obs">
<figure class="f1"><div class="shot2"><img loading="lazy" decoding="async" class="tdimg " src="assets/img/aded59896146.jpg" alt="Lista inicial de Consulta"><span class="badge">1</span></div><figcaption><b>Lista inicial</b><br><span class="cap">A aba “Operações” abria com os investimentos.</span></figcaption></figure>
<figure class="f2"><div class="shot2"><img loading="lazy" decoding="async" class="tdimg " src="assets/img/03675ddf3f0b.jpg" alt="Filtro de Operação"><span class="badge">2</span></div><figcaption><b>Filtro</b><br><span class="cap">Em “Operação”, era preciso escolher “Resgate”.</span></figcaption></figure>
<figure class="f3"><div class="shot2"><img loading="lazy" decoding="async" class="tdimg " src="assets/img/fe7164596127.jpg" alt="Resultado com o resgate"><span class="badge">3</span></div><figcaption><b>Resultado</b><br><span class="cap">Só então o resgate aparecia na lista.</span></figcaption></figure>
</div>
</div></section>

<section class="band" id="mudancas"><div class="wrap">
<div class="chg-head"><div class="head"><div class="kick">04 · Proposta</div><h2>Duas mudanças no caminho até o resgate</h2>
<p>O resgate tinha sido registrado. O problema era encontrá-lo. Propus duas mudanças: uma na saída da confirmação e outra na forma como a lista de operações abria.</p></div>
<button class="btn primary" id="tdF" aria-pressed="false">Mostrar os pontos de atrito</button></div>
<div class="chg2" id="tdChg">
<figure class="panel cf"><div class="cf-shot"><img loading="lazy" decoding="async" class="tdimg " src="assets/img/c228838b13ce.jpg" alt="Confirmação do agendamento"><div class="hx" style="--c:var(--pink);left:4%;top:57.4%;width:92%;height:7.1%"></div><div class="hx" style="--c:var(--lime);left:8.3%;top:90.9%;width:83.3%;height:4.9%"></div></div>
<div class="cf-txt"><span class="pill" style="background:#b9bdc6;justify-self:start">Confirmação</span>
<div class="notes"><ul><li style="--c:var(--pink)"><b>Orientação sem caminho</b><span class="mut">“Acompanhe seu agendamento em Consultas” indicava o lugar, mas não levava até ele.</span></li><li style="--c:var(--lime)"><b>Único botão: “Fechar”</b><span class="mut">A ação disponível devolvia o investidor ao início, longe da consulta.</span></li></ul></div>
<div class="prop"><small>Mudança proposta</small><b>Um atalho para a consulta</b><span class="mut">Ao confirmar o agendamento, um atalho levaria direto à operação em Consulta.</span></div></div></figure>
<figure class="panel cf"><div class="cf-shot"><img loading="lazy" decoding="async" class="tdimg " src="assets/img/aded59896146.jpg" alt="Lista inicial de operações"><div class="hx" style="--c:var(--pink);left:8%;top:20.8%;width:84%;height:39.7%"></div><div class="hx" style="--c:var(--lime);left:89.3%;top:6.2%;width:10%;height:4.6%"></div></div>
<div class="cf-txt"><span class="pill" style="background:#b9bdc6;justify-self:start">Lista de operações</span>
<div class="notes"><ul><li style="--c:var(--pink)"><b>Lista inicial</b><span class="mut">A aba “Operações” abria com investimentos. O resgate não estava ali.</span></li><li style="--c:var(--lime)"><b>Filtro como passagem obrigatória</b><span class="mut">O ícone no canto era o único caminho até o resgate.</span></li></ul></div>
<div class="prop"><small>Mudança proposta</small><b>Resgates junto dos investimentos</b><span class="mut">Os resgates já apareceriam na lista. O filtro passaria a refinar a busca depois de o investidor ver suas movimentações.</span></div></div></figure>
</div>
<p class="mut" style="margin-top:24px">As duas mudanças são recomendações da avaliação. O trabalho de interface e engenharia para implementá-las ficou fora deste projeto. Não há registro de teste ou métrica posterior dessa tarefa.</p>
</div></section>

<section class="band" id="recomendacao"><div class="wrap">
<div class="head"><div class="kick">05 · Decisão</div><h2>O que levamos à B3</h2>
<p>Reunimos em um relatório o uso registrado, os 32 problemas e um benchmark das landing pages de outros players do mercado financeiro. A pergunta da B3 era se valia investir na continuidade do app.</p></div>

<div class="panel" style="margin-bottom:24px">
<h3>Das descobertas às apostas</h3>
<p class="cap" style="margin:4px 0 32px">Organizamos as descobertas com o DIBB (Data, Insights, Beliefs, Bets), framework usado pelo Spotify para transformar dados em decisões.</p>
<ol class="dibb">
<li><span class="plate" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22 21H2V3H4V19H6V10H10V19H12V6H16V19H18V14H22V21Z"/></svg></span><h3><small>Dados</small>O que medimos</h3><p class="mut">Navegação no app e no site, mapas de calor e os 32 problemas da avaliação.</p></li>
<li><span class="plate" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 6C13.59 6 15.11 6.63 16.24 7.75C17.36 8.88 18 10.40 18 12C18 14.22 16.79 16.16 15 17.2V19C15 19.26 14.89 19.51 14.70 19.70C14.51 19.89 14.26 20 14 20H10C9.73 20 9.48 19.89 9.29 19.70C9.10 19.51 9 19.26 9 19V17.2C7.21 16.16 6 14.22 6 12C6 10.40 6.63 8.88 7.75 7.75C8.88 6.63 10.40 6 12 6ZM14 21V22C14 22.26 13.89 22.51 13.70 22.70C13.51 22.89 13.26 23 13 23H11C10.73 23 10.48 22.89 10.29 22.70C10.10 22.51 10 22.26 10 22V21H14ZM20 11H23V13H20V11ZM1 11H4V13H1V11ZM13 1V4H11V1H13ZM4.92 3.5L7.05 5.64L5.63 7.05L3.5 4.93L4.92 3.5ZM16.95 5.63L19.07 3.5L20.5 4.93L18.37 7.05L16.95 5.63Z"/></svg></span><h3><small>Insights</small>O que entendemos</h3><p class="mut">Não faltava interesse. Faltavam visibilidade do app, uso sem barreiras e integração com a jornada digital.</p></li>
<li><span class="plate" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 3C9.22 3 6.18 5.95 5.99 9.66L4.07 12.19C3.83 12.5 4.07 13 4.49 13H5.99V16C5.99 17.11 6.88 18 7.99 18H8.99V21H16V16.31C18.37 15.19 20 12.8 20 10C20 6.14 16.88 3 13 3ZM14 14H12V13H14V14ZM15.6 9.5C15.34 9.94 14.96 10.32 14.5 10.58V12H11.5V10.58C10.07 9.75 9.56 7.92 10.4 6.5C11.23 5.08 13.07 4.56 14.5 5.38C15.93 6.2 16.43 8.05 15.6 9.5Z"/></svg></span><h3><small>Crenças</small>O que acreditávamos</h3><p class="mut">Promover o app, corrigir fluxos críticos e valorizar consultas e operações rápidas aumentariam adoção e retenção.</p></li>
<li><span class="plate" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 2V4.07C7.38 4.53 4.53 7.38 4.07 11H2V13H4.07C4.53 16.62 7.38 19.47 11 19.93V22H13V19.93C16.62 19.47 19.47 16.62 19.93 13H22V11H19.93C19.47 7.38 16.62 4.53 13 4.07V2M11 6.08V8H13V6.09C15.5 6.5 17.5 8.5 17.92 11H16V13H17.91C17.5 15.5 15.5 17.5 13 17.92V16H11V17.91C8.5 17.5 6.5 15.5 6.08 13H8V11H6.09C6.5 8.5 8.5 6.5 11 6.08ZM12 11C11.73 11 11.48 11.10 11.29 11.29C11.10 11.48 11 11.73 11 12C11 12.26 11.10 12.51 11.29 12.70C11.48 12.89 11.73 13 12 13C12.26 13 12.51 12.89 12.70 12.70C12.89 12.51 13 12.26 13 12C13 11.73 12.89 11.48 12.70 11.29C12.51 11.10 12.26 11 12 11Z"/></svg></span><h3><small>Apostas</small>O que propusemos</h3><p class="mut">Reposicionar o app na jornada, redesenhar fluxos essenciais, criar um onboarding e priorizar as melhorias de maior impacto.</p></li>
</ol>
</div>
<div class="rec"><small>Nossa recomendação</small><div class="s">Manter o aplicativo e priorizar as jornadas de consulta e investimento.</div><p>Para quem já voltava ao app para acompanhar o próprio dinheiro, o que importava era abrir a lista e reconhecer a operação que tinha acabado de fazer.</p></div>

rsos exclusivos"><span class="no">Não</span></td></tr></tbody></table><p class="cap" style="padding:12px 20px 8px">Benchmark das landing pages, janeiro de 2024.</p></div><p class="mut">Saber quem desconhecia o aplicativo exigiria outra pesquisa.</p></div></div>

<header class="hero" id="topo"><div class="wrap">
<div class="kick" style="margin:0">Digio · ago/2022</div>
<h1>O valor precisa ser compreendido.</h1>
<p class="lead">O Digio lançaria o Digio One, um cartão Visa Signature oferecido a quem já era cliente. Testei a oferta e o portal de benefícios para entender se as pessoas percebiam o valor do novo cartão e onde consultariam as vantagens depois da troca.</p>
<dl class="ficha">
<div><dt>Papel</dt><dd>Product Designer na pesquisa do Digio One</dd></div>
<div><dt>Escopo</dt><dd>Oferta do cartão, tela inicial e portal de benefícios</dd></div>
<div><dt>Métodos</dt><dd><ul class="mlist"><li><span class="plate sm" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.54 23H7C5.9 23 5 22.11 5 21V3C5 1.89 5.89 1 7 1H17C18.1 1 19 1.89 19 3V13C18.3 13 17.63 13.13 17 13.35V5H7V19H13C13 20.54 13.58 21.94 14.54 23ZM17.75 22.16L15 19.16L16.16 18L17.75 19.59L21.34 16L22.5 17.410L17.75 22.16Z"/></svg></span>Teste de usabilidade moderado</li><li><span class="plate sm" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C7.58 3 4 4.79 4 7C4 9.21 7.58 11 12 11C16.42 11 20 9.21 20 7C20 4.79 16.42 3 12 3ZM4 9V12C4 14.21 7.58 16 12 16C16.42 16 20 14.21 20 12V9C20 11.21 16.42 13 12 13C7.58 13 4 11.21 4 9ZM4 14V17C4 19.21 7.58 21 12 21C16.42 21 20 19.21 20 17V14C20 16.21 16.42 18 12 18C7.58 18 4 16.21 4 14Z"/></svg></span>Atomic Research</li></ul></dd></div>
<div><dt>Habilidades</dt><dd>Pesquisa com usuários e arquitetura da informação</dd></div>
</dl>
<figure style="margin:0;display:grid;gap:12px">
<div class="stagebox"><img loading="lazy" decoding="async" src="assets/img/a7af6085ba02.webp" alt="Oferta do Cartão Digio One na proposta pós-teste"><img loading="lazy" decoding="async" src="assets/img/5011aaad031b.webp" alt="Portal de benefícios na proposta pós-teste, com os benefícios em lista"></div>

<section class="band" id="teste"><div class="wrap">
<div class="head"><div class="kick">01 · Teste moderado</div><h2>Duas tarefas na mesma sessão</h2>
<p>Planejei a pesquisa, escrevi o roteiro e montei o protótipo. Conduzi as sessões com clientes do Digio entre julho e agosto de 2022. O time precisava responder três perguntas.</p></div>
<div class="qs">
<div class="q vol"><span class="n">1</span><span class="chip">Oferta</span><h3 class="disp3">Que dúvidas a oferta gerava?</h3><p class="mut" style="margin:0">E quais palavras deixavam o cartão e a cobrança claros.</p></div>
<div class="q vol"><span class="n">2</span><span class="chip">Portal de benefícios</span><h3 class="disp3">Por onde a pessoa chegava às vantagens?</h3><p class="mut" style="margin:0">E se entendia a organização da tela.</p></div>
<div class="q vol"><span class="n">3</span><span class="chip">Tela inicial</span><h3 class="disp3">A nova tela inicial era percebida?</h3><p class="mut" style="margin:0">Sem que ninguém apontasse para ela.</p></div>
</div>
<p style="margin-bottom:32px">Dividi a sessão em duas tarefas. Primeiro, pedi que explorassem a oferta e solicitassem o cartão, pensando em voz alta. Depois da troca simulada, pedi que procurassem onde consultar as novas vantagens.</p>
<div class="grid2">
<div class="panel task"><div class="n" style="color:var(--case)">1</div><h3>Explorar a oferta e pedir o cartão</h3><p class="mut">Pensando em voz alta, do convite até a confirmação do pedido.</p>
<div class="flow"><span>Convite</span><i>→</i><span>Oferta</span><i>→</i><span>Endereço</span><i>→</i><span>Termos</span><i>→</i><span>Confirmação</span></div></div>
<div class="panel task"><div class="n" style="color:var(--case)">2</div><h3>Encontrar onde consultar as vantagens</h3><p class="mut">Já com o novo cartão, a partir da tela inicial.</p>
<div class="flow"><span>Tela inicial</span><i>→</i><span>?</span><i>→</i><span>Portal de benefícios</span></div></div>
</div>
<div class="why2">
<div class="why"><span class="k">Decisão de condução</span><h3 class="disp3">Não falei o nome do portal</h3><p>Deixei que escolhessem o caminho. Indicar o portal pelo nome teria dado uma pista que o app precisava oferecer sozinho.</p></div>
<div class="why"><span class="k">Decisão de condução</span><h3 class="disp3">Deixei a nova tela inicial para o fim</h3><p>Só perguntei sobre ela no encerramento, a quem não tinha comentado antes. Assim, a percepção apareceu sem indução.</p></div>
</div>
<div class="prof"><div class="num">2,5</div><p>Média de cartões por participante. Além do Digio, citaram <b class="bk">Nubank</b>, <b class="bk">Santander</b>, <b class="bk">Itaú</b>, <b class="bk">Banco do Brasil</b>, <b class="bk">Bradesco</b>, <b class="bk">Original</b>, <b class="bk">Méliuz</b> e <b class="bk">Carrefour</b>. Alguns já tinham variantes como <b class="bk">Nubank Platinum</b> e <b class="bk">Santander Unique</b>. A oferta seria comparada com cartões que a pessoa já usava.</p></div>
<p class="cap" style="margin-top:16px">Perfil recrutado: clientes ativos do Digio com renda declarada acima de R$ 5.500.</p>
</div></section>

<p>A oferta cumpria o papel: os benefícios atraíam e a anuidade foi bem recebida, pela chance de isenção. A dúvida era aplicar a regra à própria fatura.</p></div>
<div class="ctrl"><div class="seg" role="group" aria-label="Versão exibida"><button id="vT" class="o" aria-pressed="true">Versão testada</button><button id="vP" aria-pressed="false">Proposta pós-teste</button></div></div>

<section class="band" id="acesso"><div class="wrap">
<div class="head"><div class="kick">03 · Acesso</div><h2>Onde eu consulto as vantagens do cartão?</h2>
<p>A nova tela inicial foi notada. O atalho para o portal de benefícios, na mesma tela, passou despercebido pela maioria.</p></div>
<div class="row2">
<div class="cmp" id="cmp"><img loading="lazy" decoding="async" src="assets/img/1374008bb9fa.jpg" alt="Tela inicial depois da troca, com a nova skin, o cartão Visa Signature e o atalho Portal de benefícios">
<div class="a"><img loading="lazy" decoding="async" src="assets/img/4bc6d8e8d9b6.jpg" alt="Tela inicial antes da troca, com o cartão Digio"></div>
<span class="tg l">Antes</span><span class="tg r">Depois</span><span class="ln"></span><span class="kn"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 4H13V16L18.5 10.5L19.92 11.92L12 19.84L4.08 11.92L5.50 10.5L11 16V4Z"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 4H13V16L18.5 10.5L19.92 11.92L12 19.84L4.08 11.92L5.50 10.5L11 16V4Z"/></svg></span>
<input type="range" min="0" max="100" value="50" aria-label="Comparar a tela inicial antes e depois da troca"></div>
<div class="txt"><h3 class="disp3">A mudança foi percebida</h3>
<p>Depois da troca, mudavam o cabeçalho, as cores e o desenho do cartão. A maioria percebeu a diferença, principalmente pelo visual.</p>
<p class="cap">Arraste para comparar antes e depois da troca.</p></div>
</div>
<div class="row2">

<p class="mut">Na tela testada, o atalho ficava em um carrossel dentro de “Minha conta”, junto de ações como Pix e transferência. Onde você procuraria as vantagens do cartão?</p>

<li id="nA" style="--c:var(--pink)"><b>Carrossel de “Minha conta”</b><span class="mut">O atalho dividia espaço com ações da conta. Uma hipótese era que esse agrupamento levasse a pessoa a procurar recursos do cartão em outro lugar.</span></li>
<li id="nB" style="--c:var(--lime)"><b>Rodapé da tela inicial</b><span class="mut">Os botões do rodapé tinham mais destaque visual. Recomendei manter o acesso ao portal ali.</span></li>

</ul></div>
</div>
<p style="margin-top:96px">Usei Atomic Research para discutir essa decisão com o time. Cada passo partiu do anterior: o que vimos nas sessões, uma explicação possível e a recomendação.</p>

<script>
{

const app = document.getElementById('app');

const SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 7C13.32 7 14.59 7.52 15.53 8.46C16.47 9.40 17 10.67 17 12C17 13.32 16.47 14.59 15.53 15.53C14.59 16.47 13.32 17 12 17C10.67 17 9.40 16.47 8.46 15.53C7.52 14.59 7 13.32 7 12C7 10.67 7.52 9.40 8.46 8.46C9.40 7.52 10.67 7 12 7ZM12 9C11.20 9 10.44 9.31 9.87 9.87C9.31 10.44 9 11.20 9 12C9 12.79 9.31 13.55 9.87 14.12C10.44 14.68 11.20 15 12 15C12.79 15 13.55 14.68 14.12 14.12C14.68 13.55 15 12.79 15 12C15 11.20 14.68 10.44 14.12 9.87C13.55 9.31 12.79 9 12 9ZM12 2L14.39 5.42C13.65 5.15 12.84 5 12 5C11.16 5 10.35 5.15 9.61 5.42L12 2ZM3.34 7L7.5 6.65C6.9 7.16 6.36 7.78 5.94 8.5C5.5 9.24 5.25 10 5.11 10.79L3.34 7ZM3.36 17L5.12 13.23C5.26 14 5.53 14.78 5.95 15.5C6.37 16.24 6.91 16.86 7.5 17.37L3.36 17ZM20.65 7L18.88 10.79C18.74 10 18.47 9.23 18.05 8.5C17.63 7.78 17.1 7.15 16.5 6.64L20.65 7ZM20.64 17L16.5 17.36C17.09 16.85 17.62 16.22 18.04 15.5C18.46 14.77 18.73 14 18.87 13.21L20.64 17ZM12 22L9.59 18.56C10.33 18.83 11.14 19 12 19C12.82 19 13.63 18.83 14.37 18.56L12 22Z"/></svg>';

function paintToggles() {
  const light = document.documentElement.dataset.theme === 'light';
  document.querySelectorAll('[data-theme-toggle]').forEach(b => { b.innerHTML = light ? MOON : SUN; b.setAttribute('aria-label', light ? 'Mudar para o tema escuro' : 'Mudar para o tema claro'); });
}
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('cm-theme', t); } catch (e) {}
  paintToggles();
}
function savedTheme() { try { return localStorage.getItem('cm-theme'); } catch (e) { return null; } }

function unmount() {
  listeners.forEach(([t, a]) => t.removeEventListener(...a));
  listeners = [];
  app.innerHTML = '';
  document.body.className = '';
}

function mount(name, anchor) {
  if (!PAGES[name]) name = 'home';
  unmount();
  document.querySelectorAll('style[data-page]').forEach(s => s.media = s.dataset.page === name ? 'all' : 'not all');
  app.appendChild(document.getElementById('tpl-' + name).content.cloneNode(true));
  // registra os listeners globais do script da página para removê-los ao trocar de página
  const wA = window.addEventListener, dA = document.addEventListener;
  window.addEventListener = function (...a) { listeners.push([window, a]); return wA.apply(window, a); };
  document.addEventListener = function (...a) { listeners.push([document, a]); return dA.apply(document, a); };
  try {
    const sc = document.createElement('script');
    sc.textContent = document.getElementById('js-' + name).textContent;
    document.body.appendChild(sc); sc.remove();
  } finally {
    window.addEventListener = wA; document.addEventListener = dA;
  }
  cur = name;
  paintToggles();
  afterMount();
  document.title = PAGES[name].title;
  try { sessionStorage.setItem('cm-page', name); } catch (e) {}
  const el = anchor && document.getElementById(anchor);
  if (el) requestAnimationFrame(() => el.scrollIntoView({behavior: 'instant', block: 'start'}));
  else window.scrollTo({top: 0, behavior: 'instant'});
}

function go(route) {
  const [name, anchor] = route.split('#');
  if (name === cur) {
    const el = anchor && document.getElementById(anchor);
    if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'}); else window.scrollTo({top: 0, behavior: 'smooth'});
    return;
  }
  history.pushState(null, '', '#/' + name);
  mount(name, anchor);
}
const CASES = ['veloe', 'tesouro', 'digio'];
let contactIO;
function afterMount() {
  document.querySelectorAll('[data-nav]').forEach(a => {
    const on = (a.dataset.nav === 'curriculo' && cur === 'curriculo') || (a.dataset.nav === 'cases' && CASES.includes(cur));
    on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  });
  contactIO && contactIO.disconnect();
  contactIO = new IntersectionObserver(es => es.forEach(x => x.isIntersecting && x.target.classList.add('is-in')), {rootMargin: '0px 0px -20% 0px'});
  document.querySelectorAll('.cm-contact').forEach(c => contactIO.observe(c));
}

document.addEventListener('click', e => {
  const top = e.target.closest('[data-top]');
  if (top) { e.preventDefault(); window.scrollTo({top: 0, behavior: 'smooth'}); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp && cp.closest('.cm-contact')) {
    const out = cp.closest('.cm-contact').querySelector('.cm-copied');
    const ok = () => out.textContent = 'E-mail copiado.', fail = () => out.textContent = 'Não deu para copiar. O e-mail está logo abaixo.';
    try { navigator.clipboard.writeText(cp.dataset.copy).then(ok, fail); } catch (err) { fail(); }
    clearTimeout(window.__cmT); window.__cmT = setTimeout(() => out.textContent = '', 2600);
    return;
  }
  const t = e.target.closest('[data-theme-toggle]');
  if (t) { applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'); return; }
  const a = e.target.closest('[data-go]');
  if (!a) return;
  e.preventDefault(); e.stopImmediatePropagation();
  go(a.dataset.go);
}, true);
addEventListener('hashchange', () => {
  const m = location.hash.match(/^#\/([\w-]+)/);
  if (m && m[1] !== cur) mount(m[1]);
});

applyTheme(savedTheme() || 'dark');
const m = location.hash.match(/^#\/([\w-]+)/);
let start = m && m[1];
if (!start) { try { start = sessionStorage.getItem('cm-page'); } catch (e) {} }
mount(start || 'home');
if (!m) history.replaceState(null, '', '#/' + cur);
}
